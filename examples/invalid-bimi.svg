<?xml version="1.0" encoding="UTF-8"?>
<!-- Invalid for BIMI: missing Tiny-PS profile, uses <script> and external image refs -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100"
     height="100">
  <script type="text/javascript">alert('not allowed in BIMI')</script>
  <image xlink:href="https://example.com/logo.png" width="100" height="100"/>
  <animate attributeName="opacity" from="1" to="0" dur="2s" repeatCount="indefinite"/>
</svg>
